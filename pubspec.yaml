name: qader
description: "Qader application foundation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  internet_connection_checker: ^3.0.1

  # Dependency Injection
  get_it: ^9.2.0

  # Navigation
  go_router: ^17.0.0

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.2
  toastification: ^3.0.3
  lottie: ^3.3.1

  # Localization
  easy_localization: ^3.0.8

  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  geolocator: ^13.0.2

  # Utilities
  image_picker: ^1.2.1
  file_picker: ^10.3.8
  url_launcher: ^6.3.2
  smooth_page_indicator: ^3.0.0
  pinput: ^6.0.2
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - assets/translations/
    - assets/icons/
    - assets/icons/figma/
    - assets/gifs/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
